[tool.poetry]
name = "finstmt"
version = "1.4.0"
description = "Contains classes to work with financial statement data. Can calculate free cash flows and help project financial statements."
authors = ["Nick DeRobertis <whoopnip@gmail.com>"]
readme = "README.md"
packages = [{include = "finstmt"}]
license = "MIT"
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 3 - Alpha",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # List supported python versions
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
# Repo tooling for the docs build; ship it in the sdist only, never in the wheel
include = [
    { path = "conf.py", format = "sdist" },
    { path = "version.py", format = "sdist" },
]

[tool.poetry.urls]
repository = "https://github.com/chrislawson-au/py-finstmt"
documentation = "https://github.com/chrislawson-au/py-finstmt#readme"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# Every runtime dependency needs a ">=" lower bound: the min-versions CI job
# installs exactly these bounds (see .github/scripts/min_constraints.py)
pandas = ">=2.2"
numpy = ">=1.26"
sympy = ">=1.12"
scipy = ">=1.11.2"
statsmodels = ">=0.14.1"
matplotlib = ">=3.8"
pyyaml = ">=6.0.1"
tqdm = ">=4.66"
xlrd = ">=2.0.1"
xlsxwriter = ">=3.1"
prophet = { version = ">=1.1.5", optional = true }

[tool.poetry.extras]
forecast = ["prophet"]

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"
syrupy = ">=4.9"
prettyprinter = "*"
# Reads back the .xlsx files that finstmt writes with xlsxwriter
openpyxl = "*"

[tool.poetry.group.dev.dependencies]
jupyterlab = "*"

[tool.black]
include = 'finstmt.*\.pyi?$|tests.*\.pyi?$'

[tool.isort]
profile = "black"
# Skip generated, gitignored files such as the docs build output
skip_gitignore = true
skip = ['.bzr', '.direnv', '.eggs', '.git', '.hg', '.mypy_cache', '.pants.d', '.svn', '.tox', '.venv', '__pypackages__', '_build', 'buck-out', 'build', 'dist', 'node_modules', '.venvs']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# pandas attributes deprecations to the calling module, so this catches only
# finstmt's own use of deprecated pandas behavior (Pandas4Warning subclasses
# DeprecationWarning on pandas 3); warnings raised inside dependencies pass
filterwarnings = [
    "error::FutureWarning:finstmt",
    "error::DeprecationWarning:finstmt",
]

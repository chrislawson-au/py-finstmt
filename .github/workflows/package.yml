
name: Test, Build and Push Python Package and Docs

on:
  push:
    branches:
      - master
      - alpha
      - beta
      - "*.*.*"
      - "*.*"

env:
  # One BLAS thread: faster for finstmt's many small solves, and deterministic
  OPENBLAS_NUM_THREADS: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}, pandas ${{ matrix.pandas-major }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        pandas-major: ["2", "3"]
        exclude:
          # pandas 2.x publishes no wheels for Python 3.15
          - python-version: "3.15"
            pandas-major: "2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-dependencies
        with:
          python-version: ${{ matrix.python-version }}
          pandas-major: ${{ matrix.pandas-major }}
      - uses: ./.github/actions/lint-and-test

  collectTODO:
    # Upstream-only: opens issues from TODO comments; issues are off on forks
    if: github.repository == 'nickderobertis/py-finstmt'
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@master"
      - name: "TODO to Issue"
        uses: "alstr/todo-to-issue-action@v4.3"
        id: "todo"

  deploy:
    # Upstream-only: semantic-release publishes the upstream PyPI project
    if: github.repository == 'nickderobertis/py-finstmt'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: [3.8]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: pip install poetry==1.3.2
      - uses: bjoluc/semantic-release-config-poetry@v2
        with:
          pypi_token: ${{ secrets.PYPI_PASSWORD }}
          github_token: ${{ secrets.GH_TOKEN }}

  coverage:
    # Upstream-only: uploads to the upstream Codecov project
    if: github.repository == 'nickderobertis/py-finstmt'
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/install-dependencies
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run coverage and upload to Codecov.io
        uses: ./.github/actions/test-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}